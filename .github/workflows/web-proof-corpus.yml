name: Web Proof corpus

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web-proof-corpus.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-proof-corpus.yml"

jobs:
  corpus:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Proof golden corpus
        run: npm run test:proof

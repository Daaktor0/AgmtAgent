name: Web Proof corpus

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web-proof-corpus.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-proof-corpus.yml"

jobs:
  corpus:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generate routes and verify web build
        run: npm run build:dev
      - name: Typecheck
        run: npm run typecheck
      - name: DB transaction hardening tests
        run: node --experimental-strip-types --test src/lib/db-transaction.test.ts src/lib/db-context.test.ts
      - name: Production build
        run: npm run build
      - name: Proof golden corpus
        run: npm run test:proof
      - name: Full web tests
        run: npm test

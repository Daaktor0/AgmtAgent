name: Web checks

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web-checks.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-checks.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      # The Worker entry (src/worker.ts) imports a root package.
      - run: npm ci
        working-directory: .
      - run: npm ci
      - name: Cloudflare build (also generates the route tree)
        run: npm run build:cloudflare
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test

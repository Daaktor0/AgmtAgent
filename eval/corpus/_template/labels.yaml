# Copy this file per deal. Keep the two lists. Duplicate an item to add more.
# 5–15 must-finds. 3–5 traps. Quality beats volume.
#
# type:
#   defect              — something that should be surfaced
#   negotiation_point   — real, but a commercial call rather than a defect
#   trap                — looks wrong, is intended; flagging it is a miss on precision
#
# check: optional. Only set this when the finding is a mechanical engine hit.
#   amount_mismatch | broken_cross_reference | unfilled_placeholder | numbering_gap
#   duplicate_numbering | duplicate_definition | defined_but_unused | defined_term_case_drift
#   possibly_undefined_term | orphan_schedule | empty_schedule | missing_chapeau
#   forward_defined_term | circular_definition | party_name_drift | percentage_sum
#   date_logic_conflict | currency_inconsistency | threshold_conflict
#   signature_block_mismatch
# Leave check empty for judgement calls (cap, indemnity, reserved matters, etc.).
#
# ref: clause / schedule number if you have it ("5.2", "Schedule 3").
# quote: 6–12 words copied from the document if the ref is unreliable.
# accept_if: words that would make a model-issued title count as a hit.

# ---------------------------------------------------------------------------
# Must-finds
# ---------------------------------------------------------------------------

- id: DEAL-01
  type: defect
  must_find: true
  must_not_flag: false
  check: ""
  ref: ""
  quote: ""
  expected_severity: high          # high | medium | low
  expected_classification: ""      # legal_defect | drafting_defect | commercial_risk | negotiation_preference | factual_point
  description: ""
  why_it_matters: ""               # what actually goes wrong for the party you represent
  accept_if:
    - ""


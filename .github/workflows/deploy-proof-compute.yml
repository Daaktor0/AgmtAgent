name: Deploy Proof compute

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse Cloudflare Container spend
        env:
          PROOF_CONTAINERS_SPEND_APPROVED: ${{ secrets.PROOF_CONTAINERS_SPEND_APPROVED }}
        run: |
          if [ "$PROOF_CONTAINERS_SPEND_APPROVED" != "true" ]; then
            echo "Cloudflare Containers are not authorised. Included allotment has no hard stop; a stuck standard-1 instance bills overage. Do not deploy agmt-proof-compute during the four-month no-overage freeze."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Deploy isolated scan Container
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config infra/proof/compute/wrangler.jsonc
      - name: Deploy independent purge Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config infra/proof/purge/wrangler.jsonc

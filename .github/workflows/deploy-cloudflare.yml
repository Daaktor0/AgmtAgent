name: Deploy Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - name: Ensure Proof R2 bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          set +e
          bucket_output="$(npx wrangler r2 bucket create agmt-proof-objects 2>&1)"
          bucket_status=$?
          set -e
          if [ "$bucket_status" -ne 0 ] && ! grep -q "already exists, and you own it" <<<"$bucket_output"; then
            echo "$bucket_output"
            exit "$bucket_status"
          fi
      - name: Ensure production encryption secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          config="web/.output/server/wrangler.json"
          secrets_json="$(npx wrangler secret list --config "$config")"

          if ! jq -e 'any(.[]; .name == "BETTER_AUTH_SECRET")' >/dev/null <<<"$secrets_json"; then
            openssl rand -base64 48 | tr -d '\n' | npx wrangler versions secret put BETTER_AUTH_SECRET --config "$config"
          fi

          if ! jq -e 'any(.[]; .name == "AGMT_ENCRYPTION_KEY")' >/dev/null <<<"$secrets_json"; then
            openssl rand -base64 48 | tr -d '\n' | npx wrangler versions secret put AGMT_ENCRYPTION_KEY --config "$config"
          fi

          if ! jq -e 'any(.[]; .name == "RESEND_API_KEY")' >/dev/null <<<"$secrets_json"; then
            echo "::error::RESEND_API_KEY is missing from the production Worker. Add it as a Cloudflare secret before deploying."
            exit 1
          fi
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config web/.output/server/wrangler.json --keep-vars
      - name: Verify production document route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          tail_log="$(mktemp)"
          timeout 30s npx wrangler tail agmt --format json >"$tail_log" 2>&1 &
          tail_pid=$!
          sleep 5
          status="$(curl -sS --max-time 20 -o /tmp/agmt-production-response -w '%{http_code}' https://agmt.dexterinlab.workers.dev/)"
          sleep 5
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true
          echo "Production status: $status"
          head -c 1000 /tmp/agmt-production-response || true
          echo
          echo "Cloudflare tail output:"
          tail -n 200 "$tail_log"
          test "$status" = "200"

          login_status="$(curl -sS -L --max-time 20 -o /tmp/agmt-login-response -w '%{http_code}' https://agmt.dexterinlab.workers.dev/login)"
          session_status="$(curl -sS --max-time 20 -o /tmp/agmt-session-response -w '%{http_code}' https://agmt.dexterinlab.workers.dev/api/auth/get-session)"
          upload_status="$(curl -sS --max-time 20 -X POST -H 'content-type: application/vnd.openxmlformats-officedocument.wordprocessingml.document' --data-binary @/dev/null -o /tmp/agmt-upload-response -w '%{http_code}' https://agmt.dexterinlab.workers.dev/api/proof/upload)"
          echo "Login status: $login_status"
          echo "Session status: $session_status"
          echo "Anonymous upload status: $upload_status"
          test "$login_status" = "200"
          test "$session_status" = "200"
          test "$upload_status" = "401"

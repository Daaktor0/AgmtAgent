# Copy this file per deal. Delete the comments as you fill.

id: ""                      # short, stable, no spaces. e.g. ssa-aurora-2026
name: ""                    # human name. e.g. Aurora SSA — signing set
client: ""
party_represented: ""       # Company | Promoters | Investor | Purchaser | Seller | ...
counterparty: ""
document_type: ""           # SSA | SHA | SPA | SHA+SSA | disclosure letter | MSA | SaaS | other
deal_type: ""               # venture | PE | M&A | commercial
governing_law: ""           # e.g. India | Delaware | England & Wales
seat: ""                    # arbitration seat or court, if it matters
stage: ""                   # first mark-up | subsequent round | pre-signing QC | execution
round: ""                   # optional. e.g. R2, signing
primary_document: ""        # filename in documents/ that is the review target
other_documents: []         # other filenames in this deal, with roles
# other_documents:
#   - file: SHA.docx
#     role: counterpart        # primary | counterpart | disclosure_letter | side_letter | precedent | ancillary
confidential: true
redacted: false             # true if names/amounts were stripped
notes: ""                   # anything a reviewer would be told before opening the file

# What "good" means on this run. One or two sentences.
review_goal: ""
# e.g. "Company-side first mark-up of an investor-paper SSA. Find protection gaps and internal inconsistency. Do not rewrite style."

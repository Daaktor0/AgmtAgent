name: Deploy Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - name: Ensure production secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          config="web/.output/server/wrangler.json"
          secrets_json="$(npx wrangler secret list --config "$config")"

          if ! jq -e 'any(.[]; .name == "BETTER_AUTH_SECRET")' >/dev/null <<<"$secrets_json"; then
            openssl rand -base64 48 | tr -d '\n' | npx wrangler versions secret put BETTER_AUTH_SECRET --config "$config"
          fi

          if ! jq -e 'any(.[]; .name == "RESEND_API_KEY")' >/dev/null <<<"$secrets_json"; then
            echo "::error::RESEND_API_KEY is missing from the production Worker. Add it as a Cloudflare secret before deploying."
            exit 1
          fi
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config web/.output/server/wrangler.json --keep-vars --var AGMT_PUBLIC_URL:https://app.agmt.legal
      - name: Verify production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          tail_log="$(mktemp)"
          timeout 45s npx wrangler tail agmt --format json >"$tail_log" 2>&1 &
          tail_pid=$!
          sleep 5
          status="$(curl -sS --max-time 20 -o /tmp/agmt-production-response -w '%{http_code}' https://agmt.dexterinlab.workers.dev/)"
          auth_status="$(curl -sS --max-time 16 -X POST \
            -H 'content-type: application/json' \
            -H 'origin: https://agmt.dexterinlab.workers.dev' \
            --data-raw "{\"email\":\"agmt-auth-smoke-${GITHUB_RUN_ID}@example.com\",\"password\":\"not-a-real-password\"}" \
            -o /tmp/agmt-auth-smoke-response \
            -w '%{http_code}' \
            https://agmt.dexterinlab.workers.dev/api/auth/sign-in/email || true)"
          sleep 4
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true
          echo "Production status: $status"
          head -c 1000 /tmp/agmt-production-response || true
          echo
          echo "Cloudflare tail output:"
          tail -n 200 "$tail_log"
          test "$status" = "200"

          session_status="$(curl -sS --max-time 20 -o /tmp/agmt-session-response -w '%{http_code}' https://agmt.dexterinlab.workers.dev/api/auth/get-session)"
          echo "Session status: $session_status"
          echo "Auth smoke status: $auth_status"
          echo "Auth smoke body:"
          head -c 1000 /tmp/agmt-auth-smoke-response || true
          echo
          test "$session_status" = "200"
          test "$auth_status" = "401"
          jq -e '.code == "INVALID_EMAIL_OR_PASSWORD"' /tmp/agmt-auth-smoke-response >/dev/null
      - name: Verify the app.agmt.legal custom domain
        # The workers.dev checks above exercise the same Worker code but not
        # the custom domain the product actually runs on — origin trust,
        # cookie domain, and Cloudflare's routing for it are only proven by
        # hitting it directly. Read-only: creates no account, signs in with
        # no real credentials.
        run: node web/scripts/production-auth-smoke.mjs https://app.agmt.legal

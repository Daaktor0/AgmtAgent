name: Web database migration release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production-migration
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Apply forward-only migrations
        run: npm run db:migrate:release
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Direct (non-Hyperdrive) connection string to the AGMT_AUTH_DB
          # Postgres instance — this runner is plain Node outside Cloudflare,
          # so it cannot resolve the Hyperdrive binding the Worker uses.
          BETTER_AUTH_DATABASE_URL: ${{ secrets.BETTER_AUTH_DATABASE_URL }}
          AUTH_DB_MIGRATION_REQUIRED: "true"
